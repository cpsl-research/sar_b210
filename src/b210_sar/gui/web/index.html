<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B210 SAR</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>B210 SAR</h1>
  <nav id="tabs">
    <button data-tab="configs">Configs</button>
    <button data-tab="data" class="active">File view</button>
  </nav>
  <span id="status" class="muted">connecting...</span>
</header>
<main>
  <section id="tab-data">
    <div id="fv-report" class="banner"></div>
    <div class="cols">
      <div class="col list">
        <h2>Open</h2>
        <div class="small"><span id="fv-dir" class="muted"></span> <button id="fv-up">up</button></div>
        <ul id="fv-files"></ul>
        <p class="muted small" id="fv-msg"></p>
      </div>
      <div class="col detail">
        <h2 id="fv-title">No file open</h2>
        <div id="fv-controls">
          <button id="fv-back">&laquo; back</button>
          <button id="fv-play">play</button>
          <button id="fv-step">step &raquo;</button>
          <input type="range" id="fv-pos" min="0" max="0" value="0" style="width:16em">
          <span id="fv-posl" class="muted small"></span>
        </div>
        <div id="fv-params" class="small">
          <label>M sweeps/map <input id="fv-m" type="number" min="2" max="512" value="64" size="4"></label>
          <label>window <select id="fv-window"><option>hann</option><option>hamming</option><option>rect</option></select></label>
          <label>hop <input id="fv-hop" type="number" min="1" value="1" size="3"></label>
          <label>maps/s <input id="fv-rate" type="number" min="0.2" max="10" step="0.2" value="5" size="3"></label>
          <label>max range (m) <input id="fv-maxr" type="number" min="5" max="2000" value="300" size="5"></label>
          <label>leakage path (m) <input id="fv-leak" type="number" min="0" step="0.1" placeholder="none" size="5"></label>
          <label><input id="fv-static" type="checkbox"> remove static</label>
          <label>dB range <input id="fv-dbspan" type="number" min="5" max="120" value="50" size="4"></label>
          <label>top dB <input id="fv-dbtop" type="number" placeholder="auto" size="5"></label>
        </div>
        <canvas id="fv-dd" width="900" height="420"></canvas>
        <canvas id="fv-prof" width="900" height="200"></canvas>
        <div id="fv-meta" class="small"></div>
        <div id="fv-steps" class="small"></div>
      </div>
    </div>
  </section>
  <section id="tab-configs" hidden>
    <div class="cols">
      <div class="col list">
        <h2>Configs</h2>
        <table id="cfg-list"><thead><tr><th>name</th><th>kind</th><th>valid</th><th>sweep</th></tr></thead><tbody></tbody></table>
        <p class="muted small" id="limits-path"></p>
      </div>
      <div class="col detail">
        <h2 id="cfg-title">Select a config</h2>
        <div id="cfg-badges"></div>
        <div id="cfg-body" hidden>
          <div id="cfg-actions">
            <button id="btn-copy">Copy to new...</button>
            <button id="btn-delete" class="danger" hidden>Delete</button>
          </div>
          <form id="cfg-form" hidden>
            <p class="muted small">Editing a copy. Fields are checked against the hardware limits (configs/hw_limits.yaml): errors block saving, warnings do not.</p>
            <label>save as <input id="cfg-newname" placeholder="my_config" size="24"></label>
            <div id="cfg-fields"></div>
            <div id="cfg-formactions">
              <button type="button" id="btn-check">Check</button>
              <button type="button" id="btn-save">Save as new</button>
              <button type="button" id="btn-cancel">Cancel</button>
            </div>
          </form>
          <div id="cfg-issues"></div>
          <h3>Derived numbers <span class="muted small" id="basis"></span></h3>
          <table id="cfg-derived"><tbody></tbody></table>
          <h3>YAML <span class="muted small" id="ro-note"></span></h3>
          <pre id="cfg-yaml"></pre>
        </div>
      </div>
    </div>
  </section>
</main>
<script type="module" src="/js/main.js"></script>
</body>
</html>
