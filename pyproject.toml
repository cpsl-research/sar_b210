[project]
name = "b210-sar"
version = "0.1.0"
description = "Vehicle-mounted stepped-frequency SAR on a USRP B210"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "pyyaml>=6.0"]

[project.optional-dependencies]
gpu = ["cupy"]
gui = ["h5py>=3.10"]

[project.scripts]
sar-chirp = "b210_sar.chirp:main"
sar-sim = "b210_sar.sim:main"
sar-image = "b210_sar.processing.pipeline:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b210_sar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
